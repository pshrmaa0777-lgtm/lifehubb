<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIFEHUB</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131a26;
      --surface-2: #1a2436;
      --border: #253248;
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --success: #22c55e;
      --danger: #fb7185;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 84px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .logo span {
      color: var(--accent);
    }

    .date-label {
      font-size: 12px;
      color: var(--muted);
    }

    .greeting {
      margin-bottom: 18px;
    }

    .greeting h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .greeting p {
      font-size: 13px;
      color: var(--muted);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .metric-val {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .metric-lbl {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 76px;
    }

    .btn {
      background: var(--accent);
      color: #061018;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      height: 42px;
    }

    .btn:hover {
      opacity: 0.92;
    }

    .btn-sm {
      height: 32px;
      padding: 0 10px;
      font-size: 12px;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .btn-sm.done {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border-color: rgba(34, 197, 94, 0.35);
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }

    .list-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .row-main {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-text {
      font-size: 14px;
      word-break: break-word;
    }

    .item-text.completed {
      text-decoration: line-through;
      color: var(--muted);
    }

    .del-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
    }

    .del-btn:hover {
      color: var(--danger);
      background: rgba(251, 113, 133, 0.1);
    }

    .note-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }

    .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .note-body {
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 18px 8px;
    }

    .tab-view {
      display: none;
    }

    .tab-view.active {
      display: block;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 15, 23, 0.94);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div class="logo">LIFE<span>HUB</span></div>
      <div class="date-label" id="dateDisplay"></div>
    </div>

    <!-- TODAY -->
    <section id="tab-today" class="tab-view active">
      <div class="greeting">
        <h1>Today</h1>
        <p>Your daily tasks, habits, and notes in one calm space.</p>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-val" id="mTasks">0</div>
          <div class="metric-lbl">Pending Tasks</div>
        </div>
        <div class="metric">
          <div class="metric-val" id="mHabits">0/0</div>
          <div class="metric-lbl">Habits Done</div>
        </div>
        <div class="metric">
          <div class="metric-val" id="mNotes">0</div>
          <div class="metric-lbl">Saved Notes</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Up Next</div>
        <div id="todayTasks"></div>
      </div>
    </section>

    <!-- TASKS -->
    <section id="tab-tasks" class="tab-view">
      <div class="greeting">
        <h1>Tasks</h1>
        <p>Keep track of what matters today.</p>
      </div>
      <div class="panel">
        <div class="input-group">
          <input id="taskField" type="text" placeholder="What needs to get done?" onkeydown="if(event.key==='Enter') createTask()" />
          <button class="btn" onclick="createTask()">Add</button>
        </div>
        <div id="allTasks"></div>
      </div>
    </section>

    <!-- HABITS -->
    <section id="tab-habits" class="tab-view">
      <div class="greeting">
        <h1>Habits</h1>
        <p>Build steady daily consistency.</p>
      </div>
      <div class="panel">
        <div class="input-group">
          <input id="habitField" type="text" placeholder="Add a daily habit..." onkeydown="if(event.key==='Enter') createHabit()" />
          <button class="btn" onclick="createHabit()">Add</button>
        </div>
        <div id="allHabits"></div>
      </div>
    </section>

    <!-- NOTES -->
    <section id="tab-notes" class="tab-view">
      <div class="greeting">
        <h1>Notes</h1>
        <p>Capture quick thoughts and key details.</p>
      </div>
      <div class="panel">
        <textarea id="noteField" placeholder="Write a quick note..."></textarea>
        <div style="margin-top: 10px; display: flex; justify-content: flex-end;">
          <button class="btn" onclick="createNote()">Save Note</button>
        </div>
        <div id="allNotes"></div>
      </div>
    </section>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" id="btn-today" onclick="openTab('today')">Today</button>
    <button class="nav-item" id="btn-tasks" onclick="openTab('tasks')">Tasks</button>
    <button class="nav-item" id="btn-habits" onclick="openTab('habits')">Habits</button>
    <button class="nav-item" id="btn-notes" onclick="openTab('notes')">Notes</button>
  </nav>

  <script>
    const KEY = 'lifehub_v1';
    const todayISO = new Date().toISOString().slice(0, 10);

    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'short',
      month: 'short',
      day: 'numeric'
    });

    let data = JSON.parse(localStorage.getItem(KEY) || 'null') || {
      tasks: [],
      habits: [],
      notes: []
    };

    function persist() {
      localStorage.setItem(KEY, JSON.stringify(data));
      renderAll();
    }

    function openTab(tab) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('btn-' + tab).classList.add('active');
    }

    function createTask() {
      const input = document.getElementById('taskField');
      const title = input.value.trim();
      if (!title) return;
      data.tasks.unshift({ id: Date.now(), title, done: false });
      input.value = '';
      persist();
    }

    function toggleTask(id) {
      const item = data.tasks.find(t => t.id === id);
      if (item) {
        item.done = !item.done;
        persist();
      }
    }

    function removeTask(id) {
      data.tasks = data.tasks.filter(t => t.id !== id);
      persist();
    }

    function createHabit() {
      const input = document.getElementById('habitField');
      const name = input.value.trim();
      if (!name) return;
      data.habits.unshift({ id: Date.now(), name, dates: [] });
      input.value = '';
      persist();
    }

    function toggleHabit(id) {
      const item = data.habits.find(h => h.id === id);
      if (!item) return;
      if (item.dates.includes(todayISO)) {
        item.dates = item.dates.filter(d => d !== todayISO);
      } else {
        item.dates.push(todayISO);
      }
      persist();
    }

    function removeHabit(id) {
      data.habits = data.habits.filter(h => h.id !== id);
      persist();
    }

    function createNote() {
      const input = document.getElementById('noteField');
      const body = input.value.trim();
      if (!body) return;
      data.notes.unshift({
        id: Date.now(),
        body,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      input.value = '';
      persist();
    }

    function removeNote(id) {
      data.notes = data.notes.filter(n => n.id !== id);
      persist();
    }

    function esc(text) {
      return text.replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function renderAll() {
      const pending = data.tasks.filter(t => !t.done);
      const doneHabits = data.habits.filter(h => h.dates.includes(todayISO)).length;

      document.getElementById('mTasks').textContent = pending.length;
      document.getElementById('mHabits').textContent = `${doneHabits}/${data.habits.length}`;
      document.getElementById('mNotes').textContent = data.notes.length;

      document.getElementById('todayTasks').innerHTML = pending.length
        ? pending.slice(0, 5).map(t => `
            <div class="list-row">
              <div class="row-main">
                <input type="checkbox" class="checkbox" onchange="toggleTask(${t.id})" />
                <span class="item-text">${esc(t.title)}</span>
              </div>
            </div>
          `).join('')
        : `<div class="empty-state">No pending tasks right now.</div>`;

      document.getElementById('allTasks').innerHTML = data.tasks.length
        ? data.tasks.map(t => `
            <div class="list-row">
              <div class="row-main">
                <input type="checkbox" class="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})" />
                <span class="item-text ${t.done ? 'completed' : ''}">${esc(t.title)}</span>
              </div>
              <button class="del-btn" onclick="removeTask(${t.id})">Delete</button>
            </div>
          `).join('')
        : `<div class="empty-state">No tasks added yet.</div>`;

      document.getElementById('allHabits').innerHTML = data.habits.length
        ? data.habits.map(h => {
            const isDone = h.dates.includes(todayISO);
            return `
              <div class="list-row">
                <div class="row-main">
                  <button class="btn-sm ${isDone ? 'done' : ''}" onclick="toggleHabit(${h.id})">
                    ${isDone ? 'Done' : 'Complete'}
                  </button>
                  <span class="item-text">${esc(h.name)}</span>
                </div>
                <button class="del-btn" onclick="removeHabit(${h.id})">Delete</button>
              </div>
            `;
          }).join('')
        : `<div class="empty-state">No habits added yet.</div>`;

      document.getElementById('allNotes').innerHTML = data.notes.length
        ? data.notes.map(n => `
            <div class="note-card">
              <div class="note-meta">
                <span>${esc(n.time)}</span>
                <button class="del-btn" onclick="removeNote(${n.id})">Delete</button>
              </div>
              <div class="note-body">${esc(n.body)}</div>
            </div>
          `).join('')
        : `<div class="empty-state">No notes saved yet.</div>`;
    }

    renderAll();
  </script>
</body>
</html>
