<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>LIFEHUB</title>
<style>
:root{--bg:#0b0f17;--card:#131a26;--card2:#1a2333;--accent:#38bdf8;--text:#e6edf6;--muted:#8394ab;--line:#22304a;--danger:#f87171;--ok:#34d399}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-0.2em}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;color:var(--accent);font-size:1.1rem}
#dateLabel{color:var(--muted);font-size:.9rem}
.view{display:none}
.view.active{display:block}
h2{font-size:1.15rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h3{font-size:.95rem;margin:20px 0 8px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--text);cursor:pointer;font:inherit;display:block;width:100%}
.stat:hover,.stat:focus-visible{border-color:var(--accent);outline:none}
.stat .si{color:var(--accent);font-size:1.3rem;display:block;margin-bottom:6px}
.stat b{display:block;font-size:1.8rem;color:var(--text)}
.stat span.l{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input[type=text],input[type=date],input[type=time],select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;min-width:0;color-scheme:dark}
input[type=text]{flex:1}
textarea{width:100%;min-height:90px;resize:vertical;margin-bottom:8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#04202e;border:0;border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:6px 9px;font-size:.8rem;border-radius:8px}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.time{color:var(--accent);font-variant-numeric:tabular-nums;font-size:.85rem;flex:none;display:inline-flex;align-items:center;gap:4px}
.badge{background:var(--card2);color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;flex:none;display:inline-flex;align-items:center;gap:4px}
.empty{color:var(--muted);font-size:.9rem;padding:8px 2px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.note p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.8rem}
.note .acts{display:flex;gap:6px}
.timer{text-align:center;padding:24px 14px}
#clock{font-size:4rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em;margin:14px 0}
.timer .row{justify-content:center}
.done-count{color:var(--muted)}
.done-count b{color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 2px;font-size:.7rem;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg.i{width:22px;height:22px}
nav button.active{color:var(--accent);background:var(--card2)}
@media (prefers-reduced-motion:no-preference){.view.active{animation:fade .18s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
    <symbol id="i-habit" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2h5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.5 1 2 1.8 2C10.5 8 11 5.5 12 3z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
  </defs>
</svg>

<main>
  <header>
    <div class="logo"><svg class="i"><use href="#i-bolt"/></svg>LIFEHUB</div>
    <div id="dateLabel"></div>
  </header>

  <section class="view active" id="view-today" data-view="today">
    <div class="grid">
      <button class="stat" data-goto="tasks"><span class="si"><svg class="i"><use href="#i-task"/></svg></span><b id="sTasks">0</b><span class="l">Pending tasks</span></button>
      <button class="stat" data-goto="calendar"><span class="si"><svg class="i"><use href="#i-cal"/></svg></span><b id="sSched">0</b><span class="l">Scheduled today</span></button>
      <button class="stat" data-goto="habits"><span class="si"><svg class="i"><use href="#i-habit"/></svg></span><b id="sHabits">0/0</b><span class="l">Habits done</span></button>
      <button class="stat" data-goto="notes"><span class="si"><svg class="i"><use href="#i-note"/></svg></span><b id="sNotes">0</b><span class="l">Saved notes</span></button>
    </div>
    <h3><svg class="i"><use href="#i-clock"/></svg>Today's schedule</h3>
    <div id="todaySched"></div>
    <h3><svg class="i"><use href="#i-task"/></svg>Up next</h3>
    <div id="upNext"></div>
  </section>

  <section class="view" id="view-calendar" data-view="calendar">
    <h2><svg class="i"><use href="#i-cal"/></svg>Calendar</h2>
    <div class="row">
      <input type="date" id="calDate" aria-label="Date">
      <input type="time" id="calTime" aria-label="Time">
    </div>
    <div class="row">
      <input type="text" id="calTitle" placeholder="Event title" maxlength="120" aria-label="Event title">
      <button class="btn" id="calAdd"><svg class="i"><use href="#i-plus"/></svg>Add</button>
    </div>
    <div id="calList"></div>
  </section>

  <section class="view" id="view-tasks" data-view="tasks">
    <h2><svg class="i"><use href="#i-task"/></svg>Tasks</h2>
    <div class="row">
      <input type="text" id="taskInput" placeholder="Add a task" maxlength="160" aria-label="New task">
      <button class="btn" id="taskAdd"><svg class="i"><use href="#i-plus"/></svg>Add</button>
    </div>
    <div id="taskList"></div>
  </section>

  <section class="view" id="view-habits" data-view="habits">
    <h2><svg class="i"><use href="#i-habit"/></svg>Habits</h2>
    <div class="row">
      <input type="text" id="habitInput" placeholder="Add a habit" maxlength="80" aria-label="New habit">
      <button class="btn" id="habitAdd"><svg class="i"><use href="#i-plus"/></svg>Add</button>
    </div>
    <div id="habitList"></div>
  </section>

  <section class="view" id="view-notes" data-view="notes">
    <h2><svg class="i"><use href="#i-note"/></svg>Notes</h2>
    <textarea id="noteInput" placeholder="Write a note" maxlength="2000" aria-label="New note"></textarea>
    <div class="row"><button class="btn" id="noteAdd"><svg class="i"><use href="#i-save"/></svg>Save Note</button></div>
    <div id="noteList"></div>
  </section>

  <section class="view" id="view-focus" data-view="focus">
    <h2><svg class="i"><use href="#i-timer"/></svg>Focus</h2>
    <div class="card timer">
      <select id="lenSel" aria-label="Session length">
        <option value="25">25 min Focus</option>
        <option value="50">50 min Deep Work</option>
        <option value="5">5 min Break</option>
      </select>
      <div id="clock" aria-live="off">25:00</div>
      <div class="row">
        <button class="btn" id="tStart"><svg class="i"><use href="#i-play"/></svg><span id="tStartLbl">Start</span></button>
        <button class="btn ghost" id="tReset"><svg class="i"><use href="#i-reset"/></svg>Reset</button>
      </div>
      <div class="done-count">Focus sessions completed today: <b id="sessCount">0</b></div>
    </div>
  </section>
</main>

<nav id="nav" aria-label="Main">
  <button data-tab="today" class="active"><svg class="i"><use href="#i-today"/></svg>Today</button>
  <button data-tab="calendar"><svg class="i"><use href="#i-cal"/></svg>Calendar</button>
  <button data-tab="tasks"><svg class="i"><use href="#i-task"/></svg>Tasks</button>
  <button data-tab="habits"><svg class="i"><use href="#i-habit"/></svg>Habits</button>
  <button data-tab="notes"><svg class="i"><use href="#i-note"/></svg>Notes</button>
  <button data-tab="focus"><svg class="i"><use href="#i-timer"/></svg>Focus</button>
</nav>

<script>
(function () {
  'use strict';
  var KEY = 'lifehub_v4';
  var state = { tasks: [], events: [], habits: [], notes: [], sessions: {} };
  var editing = null; /* { kind: 'task' | 'note', id: string } */

  function $(id) { return document.getElementById(id); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function ic(name) { return '<svg class="i"><use href="#i-' + name + '"/></svg>'; }
  function setHTML(id, html) { var el = $(id); if (el) el.innerHTML = html; }
  function setText(id, t) { var el = $(id); if (el) el.textContent = t; }

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return;
      state.tasks = arr(d.tasks).filter(function (t) { return t && typeof t.text === 'string' && t.id; });
      state.events = arr(d.events).filter(function (e) { return e && typeof e.title === 'string' && e.id; });
      state.habits = arr(d.habits).filter(function (h) { return h && typeof h.name === 'string' && h.id; })
        .map(function (h) { h.dates = arr(h.dates); return h; });
      state.notes = arr(d.notes).filter(function (n) { return n && typeof n.text === 'string' && n.id; });
      state.sessions = (d.sessions && typeof d.sessions === 'object' && !Array.isArray(d.sessions)) ? d.sessions : {};
    } catch (e) { /* malformed or unavailable storage: start empty */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage full or blocked */ }
  }

  /* ---------- helpers ---------- */
  function streak(h) {
    var set = {}, i;
    for (i = 0; i < h.dates.length; i++) set[h.dates[i]] = true;
    var d = new Date();
    if (!set[ymd(d)]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (set[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function byTime(a, b) { return (a.time || '').localeCompare(b.time || ''); }
  function eventsOn(date) { return state.events.filter(function (e) { return e.date === date; }).sort(byTime); }
  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function remove(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) { list.splice(i, 1); return; } }
  function isEditing(kind, id) { return editing && editing.kind === kind && editing.id === id; }

  function eventRow(e) {
    return '<div class="item' + (e.done ? ' done' : '') + '">' +
      '<input type="checkbox" data-act="evt-toggle" data-id="' + esc(e.id) + '"' + (e.done ? ' checked' : '') + ' aria-label="Mark event complete">' +
      '<span class="time">' + ic('clock') + esc(e.time || '--:--') + '</span>' +
      '<span class="txt">' + esc(e.title) + '</span>' +
      '<button class="btn sm del" data-act="evt-del" data-id="' + esc(e.id) + '" aria-label="Delete event">' + ic('trash') + '</button></div>';
  }
  function taskRow(t, full) {
    if (full && isEditing('task', t.id)) {
      return '<div class="item"><input type="text" data-edit-input value="' + esc(t.text) + '" maxlength="160" aria-label="Edit task">' +
        '<button class="btn sm" data-act="task-save" data-id="' + esc(t.id) + '" aria-label="Save task">' + ic('check') + '</button>' +
        '<button class="btn sm ghost" data-act="edit-cancel" aria-label="Cancel edit">' + ic('x') + '</button></div>';
    }
    return '<div class="item' + (t.done ? ' done' : '') + '">' +
      '<input type="checkbox" data-act="task-toggle" data-id="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + ' aria-label="Mark task complete">' +
      '<span class="txt">' + esc(t.text) + '</span>' +
      (full ? '<button class="btn sm ghost" data-act="task-edit" data-id="' + esc(t.id) + '" aria-label="Edit task">' + ic('edit') + '</button>' +
        '<button class="btn sm del" data-act="task-del" data-id="' + esc(t.id) + '" aria-label="Delete task">' + ic('trash') + '</button>' : '') + '</div>';
  }
  function noteRow(n) {
    if (isEditing('note', n.id)) {
      return '<div class="note"><textarea data-edit-input maxlength="2000" aria-label="Edit note">' + esc(n.text) + '</textarea>' +
        '<div class="acts"><button class="btn sm" data-act="note-save" data-id="' + esc(n.id) + '">' + ic('check') + 'Save</button>' +
        '<button class="btn sm ghost" data-act="edit-cancel">' + ic('x') + 'Cancel</button></div></div>';
    }
    var when = '';
    try { when = new Date(n.ts).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { when = ''; }
    if (n.edited) when += ' (edited)';
    return '<div class="note"><p>' + esc(n.text) + '</p><div class="meta"><span>' + esc(when) + '</span><span class="acts">' +
      '<button class="btn sm ghost" data-act="note-edit" data-id="' + esc(n.id) + '" aria-label="Edit note">' + ic('edit') + '</button>' +
      '<button class="btn sm del" data-act="note-del" data-id="' + esc(n.id) + '" aria-label="Delete note">' + ic('trash') + '</button></span></div></div>';
  }

  /* ---------- render ---------- */
  function render() {
    var td = today();
    setText('dateLabel', new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }));

    var pending = state.tasks.filter(function (t) { return !t.done; });
    var todayEvents = eventsOn(td);
    var doneHabits = state.habits.filter(function (h) { return h.dates.indexOf(td) !== -1; }).length;

    setText('sTasks', String(pending.length));
    setText('sSched', String(todayEvents.length));
    setText('sHabits', doneHabits + '/' + state.habits.length);
    setText('sNotes', String(state.notes.length));
    setHTML('todaySched', todayEvents.length ? todayEvents.map(eventRow).join('') : '<div class="empty">Nothing scheduled today.</div>');
    setHTML('upNext', pending.length ? pending.slice(0, 5).map(function (t) { return taskRow(t, false); }).join('') : '<div class="empty">No pending tasks.</div>');

    var cal = $('calDate');
    var sel = cal && cal.value ? cal.value : td;
    var list = eventsOn(sel);
    setHTML('calList', list.length ? list.map(eventRow).join('') : '<div class="empty">No events on this date.</div>');

    setHTML('taskList', state.tasks.length ? state.tasks.map(function (t) { return taskRow(t, true); }).join('') : '<div class="empty">No tasks yet. Add one above.</div>');

    setHTML('habitList', state.habits.length ? state.habits.map(function (h) {
      var done = h.dates.indexOf(td) !== -1;
      return '<div class="item' + (done ? ' done' : '') + '">' +
        '<span class="txt">' + esc(h.name) + '</span>' +
        '<span class="badge">' + ic('flame') + streak(h) + 'd</span>' +
        '<button class="btn sm' + (done ? '' : ' ghost') + '" data-act="habit-toggle" data-id="' + esc(h.id) + '">' + ic('check') + (done ? 'Done' : 'Complete') + '</button>' +
        '<button class="btn sm del" data-act="habit-del" data-id="' + esc(h.id) + '" aria-label="Delete habit">' + ic('trash') + '</button></div>';
    }).join('') : '<div class="empty">No habits yet. Add one above.</div>');

    setHTML('noteList', state.notes.length ? state.notes.map(noteRow).join('') : '<div class="empty">No notes saved yet.</div>');

    setText('sessCount', String(state.sessions[td] || 0));

    if (editing) {
      var inp = document.querySelector('[data-edit-input]');
      if (inp) { inp.focus(); try { var l = inp.value.length; inp.setSelectionRange(l, l); } catch (e) { /* ignore */ } }
    }
  }
  function commit() { save(); render(); }

  /* ---------- navigation ---------- */
  function go(name) {
    editing = null;
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].classList.toggle('active', views[i].getAttribute('data-view') === name);
    var btns = document.querySelectorAll('#nav button');
    for (var j = 0; j < btns.length; j++) btns[j].classList.toggle('active', btns[j].getAttribute('data-tab') === name);
    window.scrollTo(0, 0);
    render();
  }

  /* ---------- adders ---------- */
  function add
