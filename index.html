<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIFEHUB</title>
<style>
:root{--bg:#0b0f17;--card:#131a26;--card2:#1a2333;--accent:#38bdf8;--text:#e6edf6;--muted:#8394ab;--line:#22304a;--danger:#f87171;--ok:#34d399}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.logo{font-weight:800;letter-spacing:.14em;color:var(--accent);font-size:1.1rem}
#dateLabel{color:var(--muted);font-size:.9rem}
.view{display:none}
.view.active{display:block}
h2{font-size:1.15rem;margin:0 0 12px}
h3{font-size:.95rem;margin:20px 0 8px;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;color:var(--text);cursor:pointer;font:inherit}
.stat:hover,.stat:focus-visible{border-color:var(--accent);outline:none}
.stat b{display:block;font-size:1.8rem;color:var(--accent)}
.stat span{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input[type=text],input[type=date],input[type=time],select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;min-width:0}
input[type=text]{flex:1}
textarea{width:100%;min-height:90px;resize:vertical;margin-bottom:8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#04202e;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:6px 10px;font-size:.8rem;border-radius:8px}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.time{color:var(--accent);font-variant-numeric:tabular-nums;font-size:.85rem;flex:none}
.badge{background:var(--card2);color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;flex:none}
.empty{color:var(--muted);font-size:.9rem;padding:8px 2px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.note p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.8rem}
.timer{text-align:center;padding:24px 14px}
#clock{font-size:4rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em;margin:14px 0}
.timer .row{justify-content:center}
.done-count{color:var(--muted)}
.done-count b{color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 2px;font-size:.72rem;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:1.2rem;line-height:1}
nav button.active{color:var(--accent);background:var(--card2)}
@media (prefers-reduced-motion:no-preference){.view.active{animation:fade .18s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<main>
  <header><div class="logo">LIFEHUB</div><div id="dateLabel"></div></header>

  <section class="view active" id="view-today" data-view="today">
    <div class="grid">
      <button class="stat" data-goto="tasks"><b id="sTasks">0</b><span>Pending tasks</span></button>
      <button class="stat" data-goto="calendar"><b id="sSched">0</b><span>Scheduled today</span></button>
      <button class="stat" data-goto="habits"><b id="sHabits">0/0</b><span>Habits done</span></button>
      <button class="stat" data-goto="notes"><b id="sNotes">0</b><span>Saved notes</span></button>
    </div>
    <h3>Today's schedule</h3>
    <div id="todaySched"></div>
    <h3>Up next</h3>
    <div id="upNext"></div>
  </section>

  <section class="view" id="view-calendar" data-view="calendar">
    <h2>Calendar</h2>
    <div class="row">
      <input type="date" id="calDate" aria-label="Date">
      <input type="time" id="calTime" aria-label="Time">
    </div>
    <div class="row">
      <input type="text" id="calTitle" placeholder="Event title" maxlength="120" aria-label="Event title">
      <button class="btn" id="calAdd">Schedule</button>
    </div>
    <div id="calList"></div>
  </section>

  <section class="view" id="view-tasks" data-view="tasks">
    <h2>Tasks</h2>
    <div class="row">
      <input type="text" id="taskInput" placeholder="Add a task" maxlength="160" aria-label="New task">
      <button class="btn" id="taskAdd">Add task</button>
    </div>
    <div id="taskList"></div>
  </section>

  <section class="view" id="view-habits" data-view="habits">
    <h2>Habits</h2>
    <div class="row">
      <input type="text" id="habitInput" placeholder="Add a habit" maxlength="80" aria-label="New habit">
      <button class="btn" id="habitAdd">Add habit</button>
    </div>
    <div id="habitList"></div>
  </section>

  <section class="view" id="view-notes" data-view="notes">
    <h2>Notes</h2>
    <textarea id="noteInput" placeholder="Write a note" maxlength="2000" aria-label="New note"></textarea>
    <div class="row"><button class="btn" id="noteAdd">Save note</button></div>
    <div id="noteList"></div>
  </section>

  <section class="view" id="view-focus" data-view="focus">
    <h2>Focus</h2>
    <div class="card timer">
      <select id="lenSel" aria-label="Session length">
        <option value="25">25 min Focus</option>
        <option value="50">50 min Deep Work</option>
        <option value="5">5 min Break</option>
      </select>
      <div id="clock">25:00</div>
      <div class="row">
        <button class="btn" id="tStart">Start</button>
        <button class="btn ghost" id="tReset">Reset</button>
      </div>
      <div class="done-count">Focus sessions completed today: <b id="sessCount">0</b></div>
    </div>
  </section>
</main>

<nav id="nav" aria-label="Main">
  <button data-tab="today" class="active"><span class="ic">&#9673;</span>Today</button>
  <button data-tab="calendar"><span class="ic">&#9638;</span>Calendar</button>
  <button data-tab="tasks"><span class="ic">&#10003;</span>Tasks</button>
  <button data-tab="habits"><span class="ic">&#8635;</span>Habits</button>
  <button data-tab="notes"><span class="ic">&#9998;</span>Notes</button>
  <button data-tab="focus"><span class="ic">&#9201;</span>Focus</button>
</nav>

<script>
(function () {
  'use strict';
  var KEY = 'lifehub_v4';
  var state = { tasks: [], events: [], habits: [], notes: [], sessions: {} };
  var tab = 'today';

  function $(id) { return document.getElementById(id); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function setHTML(id, html) { var el = $(id); if (el) el.innerHTML = html; }
  function setText(id, t) { var el = $(id); if (el) el.textContent = t; }

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return;
      state.tasks = arr(d.tasks).filter(function (t) { return t && typeof t.text === 'string'; });
      state.events = arr(d.events).filter(function (e) { return e && typeof e.title === 'string'; });
      state.habits = arr(d.habits).filter(function (h) { return h && typeof h.name === 'string'; })
        .map(function (h) { h.dates = arr(h.dates); return h; });
      state.notes = arr(d.notes).filter(function (n) { return n && typeof n.text === 'string'; });
      state.sessions = (d.sessions && typeof d.sessions === 'object' && !Array.isArray(d.sessions)) ? d.sessions : {};
    } catch (e) { /* ignore malformed or unavailable storage */ }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage full or blocked */ }
  }

  /* ---------- helpers ---------- */
  function streak(h) {
    var set = {}, i;
    for (i = 0; i < h.dates.length; i++) set[h.dates[i]] = true;
    var d = new Date();
    if (!set[ymd(d)]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (set[ymd(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function byTime(a, b) { return (a.time || '').localeCompare(b.time || ''); }
  function eventsOn(date) { return state.events.filter(function (e) { return e.date === date; }).sort(byTime); }
  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function remove(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) { list.splice(i, 1); return; } }

  function eventRow(e) {
    return '<div class="item' + (e.done ? ' done' : '') + '">' +
      '<input type="checkbox" data-act="evt-toggle" data-id="' + esc(e.id) + '"' + (e.done ? ' checked' : '') + ' aria-label="Complete event">' +
      '<span class="time">' + esc(e.time || '--:--') + '</span>' +
      '<span class="txt">' + esc(e.title) + '</span>' +
      '<button class="btn sm del" data-act="evt-del" data-id="' + esc(e.id) + '">Delete</button></div>';
  }
  function taskRow(t, full) {
    return '<div class="item' + (t.done ? ' done' : '') + '">' +
      '<input type="checkbox" data-act="task-toggle" data-id="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + ' aria-label="Complete task">' +
      '<span class="txt">' + esc(t.text) + '</span>' +
      (full ? '<button class="btn sm ghost" data-act="task-edit" data-id="' + esc(t.id) + '">Edit</button>' +
        '<button class="btn sm del" data-act="task-del" data-id="' + esc(t.id) + '">Delete</button>' : '') + '</div>';
  }

  /* ---------- render ---------- */
  function render() {
    var td = today();
    var d = new Date();
    setText('dateLabel', d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }));

    var pending = state.tasks.filter(function (t) { return !t.done; });
    var todayEvents = eventsOn(td);
    var doneHabits = state.habits.filter(function (h) { return h.dates.indexOf(td) !== -1; }).length;

    setText('sTasks', String(pending.length));
    setText('sSched', String(todayEvents.length));
    setText('sHabits', doneHabits + '/' + state.habits.length);
    setText('sNotes', String(state.notes.length));
    setHTML('todaySched', todayEvents.length ? todayEvents.map(eventRow).join('') : '<div class="empty">Nothing scheduled today.</div>');
    setHTML('upNext', pending.length ? pending.slice(0, 5).map(function (t) { return taskRow(t, false); }).join('') : '<div class="empty">No pending tasks.</div>');

    var cal = $('calDate');
    var sel = cal && cal.value ? cal.value : td;
    var list = eventsOn(sel);
    setHTML('calList', list.length ? list.map(eventRow).join('') : '<div class="empty">No events on this date.</div>');

    setHTML('taskList', state.tasks.length ? state.tasks.map(function (t) { return taskRow(t, true); }).join('') : '<div class="empty">No tasks yet. Add one above.</div>');

    setHTML('habitList', state.habits.length ? state.habits.map(function (h) {
      var done = h.dates.indexOf(td) !== -1;
      return '<div class="item' + (done ? ' done' : '') + '">' +
        '<span class="txt">' + esc(h.name) + '</span>' +
        '<span class="badge">' + streak(h) + 'd</span>' +
        '<button class="btn sm' + (done ? '' : ' ghost') + '" data-act="habit-toggle" data-id="' + esc(h.id) + '">' + (done ? 'Done' : 'Complete') + '</button>' +
        '<button class="btn sm del" data-act="habit-del" data-id="' + esc(h.id) + '">Delete</button></div>';
    }).join('') : '<div class="empty">No habits yet. Add one above.</div>');

    setHTML('noteList', state.notes.length ? state.notes.map(function (n) {
      var when = '';
      try { when = new Date(n.ts).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { when = ''; }
      return '<div class="note"><p>' + esc(n.text) + '</p><div class="meta"><span>' + esc(when) + '</span>' +
        '<button class="btn sm del" data-act="note-del" data-id="' + esc(n.id) + '">Delete</button></div></div>';
    }).join('') : '<div class="empty">No notes saved yet.</div>');

    setText('sessCount', String(state.sessions[td] || 0));
  }

  function commit() { save(); render(); }

  function go(name) {
    tab = name;
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].classList.toggle('active', views[i].getAttribute('data-view') === name);
    var btns = document.querySelectorAll('#nav button');
    for (var j = 0; j < btns.length; j++) btns[j].classList.toggle('active', btns[j].getAttribute('data-tab') === name);
    window.scrollTo(0, 0);
    render();
  }

  /* ---------- adders ---------- */
  function addTask() {
    var el = $('taskInput'); if (!el) return;
    var v = el.value.trim(); if (!v) return;
    state.tasks.push({ id: uid(), text: v, done: false });
    el.value = ''; commit();
  }
  function addHabit() {
    var el = $('habitInput'); if (!el) return;
    var v = el.value.trim(); if (!v) return;
    state.habits.push({ id: uid(), name: v, dates: [] });
    el.value = ''; commit();
  }
  function addEvent() {
    var dEl = $('calDate'), tEl = $('calTime'), nEl = $('calTitle');
    if (!dEl || !tEl || !nEl) return;
    var title = nEl.value.trim();
    if (!title) { nEl.focus(); return; }
    state.events.push({ id: uid(), date: dEl.value || today(), time: tEl.value || '', title: title, done: false });
    nEl.value = ''; commit();
  }
  function addNote() {
    var el = $('noteInput'); if (!el) return;
    var v = el.value.trim(); if (!v) return;
    state.notes.unshift({ id: uid(), text: v, ts: Date.now() });
    el.value = ''; commit();
  }

  /* ---------- events ---------- */
  function on(id, type, fn) { var el = $(id); if (el) el.addEventListener(type, fn); }
  function onEnter(id, fn) { on(id, 'keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); fn(); } }); }

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var tabBtn = t.closest('[data-tab]');
    if (tabBtn) { go(tabBtn.getAttribute('data-tab')); return; }
    var goBtn = t.closest('[data-goto]');
    if (goBtn) { go(goBtn.getAttribute('data-goto')); return; }
    var a = t.closest('[data-act]');
    if (!a) return;
    var act = a.getAttribute('data-act'), id = a.getAttribute('data-id'), item;
    if (act === 'task-toggle') { item = find(state.tasks, id); if (item) item.done = !item.done; }
    else if (act === 'task-del') { remove(state.tasks, id); }
    else if (act === 'task-edit') {
      item = find(state.tasks, id);
      if (item) {
        var nv = window.prompt('Edit task', item.text);
        if (nv !== null && nv.trim()) item.text = nv.trim();
      }
    }
    else if (act === 'evt-toggle') { item = find(state.events, id); if (item) item.done = !item.done; }
    else if (act === 'evt-del') { remove(state.events, id); }
    else if (act === 'habit-toggle') {
      item = find(state.habits, id);
      if (item) {
        var td = today(), i = item.dates.indexOf(td);
        if (i === -1) item.dates.push(td); else item.dates.splice(i, 1);
      }
    }
    else if (act === 'habit-del') { remove(state.habits, id); }
    else if (act === 'note-del') { remove(state.notes, id); }
    else return;
    commit();
  });

  on('taskAdd', 'click', addTask); onEnter('taskInput', addTask);
  on('habitAdd', 'click', addHabit); onEnter('habitInput', addHabit);
  on('calAdd', 'click', addEvent); onEnter('calTitle', addEvent);
  on('noteAdd', 'click', addNote);
  on('calDate', 'change', render);

  /* ---------- focus timer ---------- */
  var total = 25 * 60, remaining = total, running = false, endAt = 0, iv = null;

  function fmt(s) { s = Math.max(0, s); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function drawClock() {
    setText('clock', fmt(remaining));
    setText('tStart', running ? 'Pause' : (remaining < total && remaining > 0 ? 'Resume' : 'Start'));
    document.title = running ? fmt(remaining) + ' · LIFEHUB' : 'LIFEHUB';
  }
  function stopTick() { if (iv) { clearInterval(iv); iv = null; } running = false; }
  function tick() {
    remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    if (remaining <= 0) {
      stopTick();
      var mins = Math.round(total / 60);
      if (mins !== 5) { var td = today(); state.sessions[td] = (state.sessions[td] || 0) + 1; save(); render(); }
      remaining = total;
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ }
      window.setTimeout(function () { window.alert(mins === 5 ? 'Break over.' : 'Session complete. Nice work.'); }, 50);
    }
    drawClock();
  }
  function startPause() {
    if (running) { stopTick(); drawClock(); return; }
    if (remaining <= 0) remaining = total;
    endAt = Date.now() + remaining * 1000;
    running = true;
    iv = setInterval(tick, 250);
    drawClock();
  }
  function resetTimer() {
    stopTick();
    var sel = $('lenSel');
    var m = sel ? parseInt(sel.value, 10) : 25;
    total = (isNaN(m) ? 25 : m) * 60;
    remaining = total;
    drawClock();
  }
  on('tStart', 'click', startPause);
  on('tReset', 'click', resetTimer);
  on('lenSel', 'change', resetTimer);

  /* ---------- init ---------- */
  load();
  var cd = $('calDate'); if (cd) cd.value = today();
  resetTimer();
  go(tab);
})();
</script>
</body>
</html>
